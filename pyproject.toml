[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osu2yt"
version = "0.1.0"
description = "Build and incrementally sync a YouTube playlist from your osu!lazer library"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "yt-dlp>=2025.1.1",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "tzdata",  # zoneinfo on Windows (quota resets at midnight Pacific Time)
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
osu2yt = ["web/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
